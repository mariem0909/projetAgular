<article class="conference-card">
  <div class="conference-card-top">
    <span class="conference-icon" aria-hidden="true">✦</span>
    <span class="conference-tag">Conférence</span>
  </div>
  <h2>{{ conf().name }}</h2>
  <dl class="conference-meta">
    <div>
      <dt>Date</dt>
      <dd>{{ conf().date }}</dd>
    </div>
    <div>
      <dt>Lieu</dt>
      <dd>{{ conf().location }}</dd>
    </div>
  </dl>
  <button class="button" type="button" (click)="inc()">Je suis intéressé·e</button>
</article>
